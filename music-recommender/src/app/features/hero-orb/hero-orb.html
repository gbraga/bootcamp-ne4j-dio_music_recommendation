<svg viewBox="0 0 400 360" role="presentation">
  <defs>
    <linearGradient id="orb-ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#ec4899" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.2" />
    </linearGradient>
    <radialGradient id="orb-glass" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#312e81" stop-opacity="0.9" />
      <stop offset="55%" stop-color="#1e1b4b" stop-opacity="0.85" />
      <stop offset="85%" stop-color="#7c3aed" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#f97316" stop-opacity="0.9" />
    </radialGradient>
    <radialGradient id="orb-base" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#4338ca" stop-opacity="0" />
    </radialGradient>
    <filter id="orb-blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" />
    </filter>
  </defs>

  <!-- Concentric arcs -->
  <g fill="none" stroke="url(#orb-ring)" stroke-linecap="round">
    <path d="M60 250 A150 150 0 0 1 340 250" stroke-width="1.5" opacity="0.6" />
    <path d="M30 270 A178 178 0 0 1 370 270" stroke-width="1" opacity="0.35" />
    <path d="M90 230 A118 118 0 0 1 310 230" stroke-width="2" opacity="0.8" class="spin" />
  </g>

  <!-- Base glow -->
  <ellipse cx="200" cy="300" rx="110" ry="22" fill="url(#orb-base)" opacity="0.9" />
  <ellipse cx="200" cy="296" rx="70" ry="10" fill="none" stroke="#a5b4fc" stroke-width="2" filter="url(#orb-blur)" />

  <!-- Capsule -->
  <g class="float">
    <path
      d="M140 150 C140 85 260 85 260 150 L260 250 C260 292 140 292 140 250 Z"
      fill="url(#orb-glass)"
      stroke="#c4b5fd"
      stroke-opacity="0.5"
    />
    <path d="M156 150 C156 104 186 96 196 96" fill="none" stroke="#fff" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round" />

    <!-- Graph inside -->
    <g stroke="#c4b5fd" stroke-opacity="0.55" stroke-width="1">
      @for (edge of edges; track $index) {
        <line [attr.x1]="edge.from.x" [attr.y1]="edge.from.y" [attr.x2]="edge.to.x" [attr.y2]="edge.to.y" />
      }
    </g>
    @for (node of nodes; track $index) {
      <circle [attr.cx]="node.x" [attr.cy]="node.y" [attr.r]="node.r * 2.2" fill="#a78bfa" opacity="0.35" filter="url(#orb-blur)" />
      <circle [attr.cx]="node.x" [attr.cy]="node.y" [attr.r]="node.r" fill="#e0e7ff" class="pulse" [style.animation-delay.ms]="$index * 220" />
    }
  </g>
</svg>
